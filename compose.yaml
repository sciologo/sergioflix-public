name: android-video-mediafusion
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: android_video
      POSTGRES_USER: android_video
      POSTGRES_PASSWORD: ${VIDEO_POSTGRES_PASSWORD:?Genera primero .env}
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U android_video -d android_video"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  database:

